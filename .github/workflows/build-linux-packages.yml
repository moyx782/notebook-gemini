name: Build Linux Packages (deb, rpm, AppImage)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            build-essential \
            dpkg-dev \
            rpm \
            squashfs-tools \
            file \
            curl \
            desktop-file-utils \
            poppler-utils \
            xz-utils

      - name: Install Flutter SDK (stable)
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter & run tests
        run: |
          flutter --suppress-analytics --version
          flutter --suppress-analytics pub get
          flutter --suppress-analytics analyze --no-fatal-infos
          flutter --suppress-analytics test
          dart --suppress-analytics pub get -C packages/notebook_core
          (cd packages/notebook_core && dart --suppress-analytics test)
          dart --suppress-analytics pub get -C server
          (cd server && dart --suppress-analytics test)

      - name: Build .deb, .rpm, and .AppImage
        run: |
          chmod +x ./scripts/build_linux_packages.sh
          ./scripts/build_linux_packages.sh

      - name: Inspect generated packages
        run: |
          ls -lh dist/linux/
          dpkg-deb --info dist/linux/*.deb
          rpm -qip dist/linux/*.rpm
          file dist/linux/*.AppImage

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: dist/linux/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download x86_64 packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-x86_64
          path: release-assets

      - name: Download arm64 packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-arm64
          path: release-assets

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
